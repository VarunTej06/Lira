# The web container of the hosted edition. TLS is ended in front of it (App Service, Container Apps, Front Door).
# The headers match server/guard.ts, except that the page may only talk to itself and, for ticket files, to the one storage address
# in ${STORAGE_ORIGIN} (empty when there is none): an AI key must never be used from a browser.

server {
  listen 8080;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;

  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self' ${STORAGE_ORIGIN}; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;
  add_header Strict-Transport-Security "max-age=31536000" always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Liveness and readiness. This container has no other service to wait for, so both answer at once.
  location = /health { default_type text/plain; return 200 "ok\n"; }
  location = /ready  { default_type text/plain; return 200 "ok\n"; }

  # Built files have a hash in their name, so they can be kept for a year. The page itself is always fetched fresh.
  location /assets/ { expires 1y; try_files $uri =404; }
  location = /index.html { expires -1; }

  # The API container. ${API_UPSTREAM} is filled in when the container starts: the API's address inside the environment
  # (for example liraspaces-api), or 127.0.0.1:8081 for a local run. Only /api/ is forwarded, so /metrics stays private.
  location /api/ {
    proxy_pass http://${API_UPSTREAM};
    proxy_http_version 1.1;
    # No Host override on purpose: Container Apps routes by the Host header, so it must be the API's own name (nginx's default),
    # not the web app's. The browser's own origin reaches the API in the Origin header, which is what the API checks.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 32k;
    proxy_read_timeout 30s;
  }

  location ~ /\. { deny all; }

  # Every other address belongs to the single-page app (/login, /signup, /app/...), so a refresh lands on the same page.
  location / { try_files $uri $uri/ /index.html; }
}
